[project]
name = "agent-top"
version = "0.1.1"
description = "Open-source learning framework for LLM Agent development."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"ebook/build_ebook.py" = ["E501"]
