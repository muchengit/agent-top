      { t: "Templates Overview", p: "../templates/README.md", c: "Templates", l: "en" },

      { t: "Interview Question Template", p: "../templates/interview-question-template.md", c: "Templates", l: "en" },
      { t: "Eval Report Template", p: "../templates/eval-report-template.md", c: "Templates", l: "en" },
      { t: "Observability Trace Template", p: "../templates/observability-trace-template.md", c: "Templates", l: "en" },
    ];

    let activeCat = "all";
    const input = document.getElementById("q");
    const results = document.getElementById("results");
    const count = document.getElementById("count");

    function render() {
      const query = input.value.trim().toLowerCase();
      const matched = ENTRIES.filter(function (e) {
        const inCat = activeCat === "all" || e.c === activeCat;
        if (!inCat) return false;
        if (!query) return true;
        const hay = (e.t + " " + e.p + " " + e.c + " " + e.l).toLowerCase();
        return query.split(/\s+/).every(function (part) { return hay.indexOf(part) !== -1; });
      });
      count.textContent = matched.length + " of " + ENTRIES.length + " entries";
      results.innerHTML = "";
      matched.forEach(function (e) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = e.p;
        a.textContent = e.t;
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = e.c + " · " + e.l;
        li.appendChild(a);
        li.appendChild(tag);
        results.appendChild(li);
      });
    }

    document.querySelectorAll("button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll("button").forEach(function (b) { b.classList.remove("active"); });
        btn.classList.add("active");
        activeCat = btn.dataset.cat;
        render();
      });
    });

    input.addEventListener("input", render);
    render();
  </script>
</body>
</html>
