name: Publish ebook release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version tag (for example v0.1.0)
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PDF renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf

      - name: Build ebook artifacts
        run: python3 ebook/build_ebook.py

      - name: Convert EPUB to MOBI if Calibre is available
        run: |
          if command -v ebook-convert >/dev/null 2>&1; then
            for epub in dist/ebooks/*.epub; do
              base="${epub%.epub}"
              ebook-convert "$epub" "$base.mobi"
            done
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: *** secrets.GITHUB_TOKEN }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          ASSETS=(dist/ebooks/*.epub dist/ebooks/*.pdf dist/ebooks/*.html dist/ebooks/*.print.html dist/ebooks/build-report.json)
          for path in dist/ebooks/*.mobi; do
            [ -e "$path" ] && ASSETS+=("$path")
          done
          gh release create "$TAG" "${ASSETS[@]}" \
            --title "Agent-Top Ebook $TAG" \
            --notes "Ebook build artifacts generated by CI."
            --latest
