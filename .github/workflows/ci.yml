name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dev tooling
        run: python -m pip install ruff

      - name: Run repository checks
        run: |
          python scripts/check_repository.py
          python -m unittest discover -s labs -p "test_*.py"
          python -m compileall -q labs scripts
          python -m ruff check .

      - name: Clean local caches
        run: |
          find . -type d -name "__pycache__" -print0 | while read -r -d "" dir; do
            find "$dir" -maxdepth 1 -type f -delete
            rmdir "$dir"
          done
          rm -rf .ruff_cache
